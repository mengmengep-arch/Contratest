<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Contra - Classic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Touch controls - only shown on touch devices */
    #touch-controls {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 10;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    @media (pointer: coarse) {
      #touch-controls { display: block; }
    }

    #touch-controls .btn {
      pointer-events: auto;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.6);
      font-family: monospace;
      font-weight: bold;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #touch-controls .btn.active {
      background: rgba(255,255,255,0.3);
      border-color: rgba(255,255,255,0.5);
    }

    /* D-Pad */
    .dpad { position: absolute; bottom: 30px; left: 20px; width: 150px; height: 150px; }
    .dpad .btn { width: 50px; height: 50px; font-size: 20px; }
    .dpad .btn-up    { left: 50px; top: 0; }
    .dpad .btn-down  { left: 50px; bottom: 0; }
    .dpad .btn-left  { left: 0; top: 50px; }
    .dpad .btn-right { right: 0; top: 50px; }

    /* Action buttons */
    .action-btns { position: absolute; bottom: 30px; right: 20px; width: 150px; height: 120px; }
    .action-btns .btn { width: 60px; height: 60px; font-size: 14px; }
    .btn-shoot { left: 0; bottom: 0; background: rgba(216,40,0,0.2) !important; border-color: rgba(216,40,0,0.5) !important; }
    .btn-shoot.active { background: rgba(216,40,0,0.45) !important; }
    .btn-jump  { right: 0; top: 0; background: rgba(0,88,248,0.2) !important; border-color: rgba(0,88,248,0.5) !important; }
    .btn-jump.active  { background: rgba(0,88,248,0.45) !important; }

    /* Start button */
    .btn-start {
      top: 15px; left: 50%; transform: translateX(-50%);
      width: 70px !important; height: 30px !important;
      border-radius: 15px !important;
      font-size: 11px !important;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="touch-controls">
    <div class="dpad">
      <div class="btn btn-up" data-key="ArrowUp">&#9650;</div>
      <div class="btn btn-down" data-key="ArrowDown">&#9660;</div>
      <div class="btn btn-left" data-key="ArrowLeft">&#9664;</div>
      <div class="btn btn-right" data-key="ArrowRight">&#9654;</div>
    </div>
    <div class="action-btns">
      <div class="btn btn-shoot" data-key="KeyZ">FIRE</div>
      <div class="btn btn-jump" data-key="KeyX">JUMP</div>
    </div>
    <div class="btn btn-start" data-key="Enter">START</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
